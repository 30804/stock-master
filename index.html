<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 股市大師</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--purple:#bc8cff;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;--border:#30363d;--card-r:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:18px;font-weight:900;color:var(--blue);white-space:nowrap}
.logo em{font-style:normal;color:var(--text2);font-size:12px;font-weight:400;margin-left:3px}
.search-row{flex:1;display:flex;gap:8px;min-width:0}
.sinput{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:11px;color:var(--text);padding:9px 13px;font-size:14px;outline:none;min-width:0;transition:border-color .2s}
.sinput:focus{border-color:var(--blue)}
.sinput::placeholder{color:var(--text3)}
.sbtn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sbtn:active{opacity:.8}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.page.active{display:flex}
.bnav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;border:none;background:none}
.nitem.active{color:var(--blue)}
.nitem .ni{font-size:20px;line-height:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);overflow:hidden}
.chead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ctitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.cbody{padding:14px}
.hero{padding:18px 14px}
.h-name{font-size:20px;font-weight:900;margin-bottom:4px;line-height:1.2}
.h-id{font-size:12px;color:var(--text3);margin-bottom:12px}
.h-price{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h-price.up{color:var(--green)}.h-price.dn{color:var(--red)}.h-price.flat{color:var(--text)}
.h-chg{display:inline-block;font-size:16px;font-weight:800;padding:3px 10px;border-radius:8px;margin-top:6px}
.h-chg.up{background:rgba(63,185,80,.15);color:var(--green)}
.h-chg.dn{background:rgba(248,81,73,.15);color:var(--red)}
.h-chg.flat{background:var(--bg3);color:var(--text2)}
.h-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.hm{background:var(--bg3);border-radius:10px;padding:10px 12px}
.hm-l{font-size:10px;color:var(--text3);margin-bottom:3px}
.hm-v{font-size:15px;font-weight:800}
.h-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.abtn{border:1px solid var(--border);background:var(--bg3);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text2)}
.abtn.blue{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);color:var(--blue)}
.abtn.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:var(--red)}
.dsig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsc{border-radius:12px;padding:14px;text-align:center}
.dsc.sh{background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.25)}
.dsc.lg{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25)}
.dsc-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.dsc.sh .dsc-t{color:var(--purple)}.dsc.lg .dsc-t{color:var(--blue)}
.dsc-v{font-size:17px;font-weight:900;margin-bottom:10px}
.dsc-v.buy{color:var(--green)}.dsc-v.watch{color:var(--amber)}.dsc-v.avoid{color:var(--red)}
.pr3g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pr3{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 4px;text-align:center}
.pr3-l{font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase}
.pr3-v{font-size:13px;font-weight:800}
.pr3-v.gc{color:var(--green)}.pr3-v.rc{color:var(--red)}.pr3-v.bc{color:var(--blue)}
.score-wrap{display:flex;align-items:center;gap:14px}
.score-num{font-size:42px;font-weight:900;line-height:1}
.s-hi{color:var(--green)}.s-mi{color:var(--amber)}.s-lo{color:var(--red)}
.score-right{flex:1}
.score-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:6px 0}
.score-fill{height:100%;border-radius:3px}
.score-fill.s-hi{background:var(--green)}.score-fill.s-mi{background:var(--amber)}.score-fill.s-lo{background:var(--red)}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcbox{border-radius:12px;padding:12px}
.pcbox.pro{background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.2)}
.pcbox.con{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2)}
.pcbox-t{font-size:12px;font-weight:800;margin-bottom:8px}
.pcbox.pro .pcbox-t{color:var(--green)}.pcbox.con .pcbox-t{color:var(--red)}
.pci{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:5px;padding-left:12px;position:relative}
.pci::before{content:'';position:absolute;left:3px;top:7px;width:4px;height:4px;border-radius:50%}
.pcbox.pro .pci::before{background:var(--green)}.pcbox.con .pci::before{background:var(--red)}
.aiblock{background:var(--bg3);border-radius:10px;padding:12px}
.aiblock-t{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.aiblock-c{font-size:13px;color:var(--text2);line-height:1.75}
.ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldtxt{font-size:15px;color:var(--text2);font-weight:600}
.ldsub{font-size:12px;color:var(--text3);text-align:center}
.empwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:10px;min-height:160px}
.empicon{font-size:44px;opacity:.25}
.emptxt{font-size:15px;color:var(--text2);font-weight:700}
.empsub{font-size:13px;color:var(--text3);text-align:center;line-height:1.65}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.qbtn{background:none;border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 6px;cursor:pointer;color:var(--text);font-size:13px;font-weight:800;text-align:center}
.qbtn:nth-child(4n){border-right:none}
.qbtn:nth-child(n+5){border-bottom:none}
.qbtn:active{background:var(--bg3)}
.qbtn small{display:block;font-size:9px;color:var(--text3);font-weight:400;margin-top:2px}
.wli{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.wli:last-child{border-bottom:none}
.wli:active{background:var(--bg3)}
.wli-s{font-size:16px;font-weight:900;min-width:60px}
.wli-n{font-size:11px;color:var(--text3);margin-top:1px}
.wli-r{margin-left:auto;text-align:right}
.wli-p{font-size:17px;font-weight:800}
.wli-c{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-block;margin-top:2px}
.wli-c.up{background:rgba(63,185,80,.15);color:var(--green)}
.wli-c.dn{background:rgba(248,81,73,.15);color:var(--red)}
.wli-del{padding:8px;color:var(--text3);font-size:16px;background:none;border:none;cursor:pointer}
.up{color:var(--green)}.dn{color:var(--red)}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fsel{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:13px;outline:none;width:100%}
.fsel option{background:var(--bg2)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.gbtn{width:100%;background:var(--green);color:#000;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:13px;cursor:pointer}
.gbtn:active{opacity:.8}
.sri{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
.sri-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sri-sym{font-size:17px;font-weight:900}
.sri-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:800}
.sri-badge.val{background:rgba(88,166,255,.15);color:var(--blue)}
.sri-badge.gro{background:rgba(63,185,80,.15);color:var(--green)}
.sri-badge.div{background:rgba(210,153,34,.15);color:var(--amber)}
.sri-pro{font-size:12px;color:var(--text2);margin-bottom:5px;padding-left:13px;position:relative;line-height:1.5}
.sri-pro::before{content:'▲';position:absolute;left:0;color:var(--green);font-size:9px;top:3px}
.sri-risk{font-size:12px;color:var(--text2);padding-left:13px;position:relative;line-height:1.5}
.sri-risk::before{content:'▼';position:absolute;left:0;color:var(--red);font-size:9px;top:3px}
.bearbox{background:rgba(248,81,73,.06);border:1px solid rgba(248,81,73,.2);border-radius:12px;padding:13px;margin-bottom:10px}
.bearbox h4{font-size:12px;font-weight:800;color:var(--red);margin-bottom:7px}
.bearbox p{font-size:13px;color:var(--text2);line-height:1.7}
.infobox{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:12px;padding:13px;margin-bottom:10px}
.infobox h4{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:7px}
.infobox p{font-size:13px;color:var(--text2);line-height:1.7}
.notice{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--green);line-height:1.6}
/* CHART */
canvas{width:100%!important}
@media(min-width:600px){.h-meta{grid-template-columns:repeat(4,1fr)}.fgrid2{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">📈AI股市<em>大師</em></div>
  <div class="search-row">
    <input class="sinput" id="si" type="text" placeholder="代號：3481、NVDA、2330…"
      onkeydown="if(event.key==='Enter')go()" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="sbtn" onclick="go()">分析</button>
  </div>
</div>

<div class="pages">

  <!-- 分析頁 -->
  <div class="page active" id="p-analyze">
    <div id="a-out">
      <div class="notice">✅ 免 API Key！直接抓取即時股價，完全免費</div>
      <div class="empwrap">
        <div class="empicon">🏦</div>
        <div class="emptxt">搜尋股票開始分析</div>
        <div class="empsub">台股輸入數字代號（如 3481）<br>美股輸入英文代號（如 NVDA）</div>
      </div>
      <div class="card">
        <div class="chead"><span class="ctitle">⚡ 熱門快速入口</span></div>
        <div class="qgrid">
          <button class="qbtn" onclick="go2('3481')">3481<small>群創</small></button>
          <button class="qbtn" onclick="go2('2330')">2330<small>台積電</small></button>
          <button class="qbtn" onclick="go2('2317')">2317<small>鴻海</small></button>
          <button class="qbtn" onclick="go2('2308')">2308<small>台達電</small></button>
          <button class="qbtn" onclick="go2('NVDA')">NVDA<small>輝達</small></button>
          <button class="qbtn" onclick="go2('AAPL')">AAPL<small>蘋果</small></button>
          <button class="qbtn" onclick="go2('TSLA')">TSLA<small>特斯拉</small></button>
          <button class="qbtn" onclick="go2('META')">META<small>Meta</small></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 自選股頁 -->
  <div class="page" id="p-watch">
    <div class="card">
      <div class="chead">
        <span class="ctitle">⭐ 自選股清單</span>
        <button onclick="refreshWL()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 11px;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer">🔄 更新</button>
      </div>
      <div id="wl-body"></div>
    </div>
    <div class="card">
      <div class="chead"><span class="ctitle">➕ 加入自選</span></div>
      <div class="cbody" style="display:flex;gap:8px">
        <input class="sinput" id="wl-add" type="text" placeholder="輸入代號…" style="flex:1;background:var(--bg3)" onkeydown="if(event.key==='Enter')addWL()">
        <button class="sbtn" style="border-radius:10px;padding:9px 14px" onclick="addWL()">加入</button>
      </div>
    </div>
  </div>

  <!-- 選股頁 -->
  <div class="page" id="p-screen">
    <div class="card">
      <div class="chead"><span class="ctitle">🔍 條件選股篩選器</span></div>
      <div class="cbody">
        <div class="fgrid2">
          <div class="fg"><label>市場</label>
            <select class="fsel" id="sc-mkt">
              <option value="TW">🇹🇼 台股</option>
              <option value="US">🇺🇸 美股</option>
            </select></div>
          <div class="fg"><label>最低本益比</label>
            <input id="sc-pe-min" class="sinput" type="number" value="0" style="background:var(--bg3);width:100%"></div>
          <div class="fg"><label>最高本益比</label>
            <input id="sc-pe-max" class="sinput" type="number" value="30" style="background:var(--bg3);width:100%"></div>
          <div class="fg"><label>最低殖利率%</label>
            <input id="sc-div" class="sinput" type="number" value="3" style="background:var(--bg3);width:100%"></div>
        </div>
        <button class="gbtn" onclick="runScreen()">🔍 開始篩選</button>
      </div>
    </div>
    <div id="sc-out"></div>
  </div>

  <!-- K線圖頁 -->
  <div class="page" id="p-chart">
    <div class="card">
      <div class="chead">
        <span class="ctitle" id="chart-title">📈 K 線圖</span>
        <div style="display:flex;gap:6px">
          <button onclick="loadChart(chartSym,'1mo')" id="btn-1mo" class="abtn" style="padding:4px 10px;font-size:11px">1月</button>
          <button onclick="loadChart(chartSym,'3mo')" id="btn-3mo" class="abtn" style="padding:4px 10px;font-size:11px">3月</button>
          <button onclick="loadChart(chartSym,'1y')" id="btn-1y" class="abtn blue" style="padding:4px 10px;font-size:11px">1年</button>
        </div>
      </div>
      <div class="cbody" id="chart-body">
        <div class="empwrap"><div class="empicon" style="font-size:32px">📊</div><div class="emptxt">先搜尋一檔股票</div></div>
      </div>
    </div>
    <div id="indicators-out"></div>
  </div>

</div>

<nav class="bnav">
  <button class="nitem active" id="nb0" onclick="nav('analyze',0)"><span class="ni">📊</span>分析</button>
  <button class="nitem" id="nb1" onclick="nav('watch',1)"><span class="ni">⭐</span>自選</button>
  <button class="nitem" id="nb2" onclick="nav('chart',2)"><span class="ni">📈</span>K線</button>
  <button class="nitem" id="nb3" onclick="nav('screen',3)"><span class="ni">🔍</span>選股</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── CORS PROXY for Yahoo Finance ──
const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://thingproxy.freeboard.io/fetch/'
];
async function proxyFetch(url){
  for(const p of PROXIES){
    try{
      const r = await fetch(p + encodeURIComponent(url), {headers:{'x-requested-with':'XMLHttpRequest'}});
      if(r.ok){
        const t = await r.text();
        if(t.length > 100) return new Response(t, {status:200, headers:{'Content-Type':'application/json'}});
      }
    }catch(e){ continue; }
  }
  throw new Error('無法連線，請確認網路正常');
}
const YF = 'https://query1.finance.yahoo.com';
let wl = JSON.parse(localStorage.getItem('wl5')||'[]');
let lastSym = '', chartSym = '', myChart = null;

function nav(id,idx){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nitem').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  document.getElementById('nb'+idx).classList.add('active');
}
function go(){ const v=document.getElementById('si').value.trim(); if(!v) return; document.getElementById('si').value=''; analyze(v); }
function go2(s){ analyze(s); }

// ── TICKER ──
function ticker(sym){
  const s=sym.trim();
  // 中文名稱查詢
  if(/[\u4e00-\u9fff]/.test(s)){
    const code = TW_NAME_MAP[s];
    if(code) return code+'.TW';
    // 模糊匹配
    for(const [name,code] of Object.entries(TW_NAME_MAP)){
      if(name.includes(s)||s.includes(name)) return code+'.TW';
    }
  }
  const u=s.toUpperCase();
  if(/^\d{4}$/.test(u)) return u+'.TW';
  if(/^\d{4}\.(TW|TWO)$/i.test(u)) return u.toUpperCase();
  return u;
}

// ── FETCH QUOTE ──
async function fetchQuote(sym){
  const t=ticker(sym);
  const url=`${YF}/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=5d`;
  try{
    const r=await proxyFetch(url);
    if(!r.ok) throw new Error('fetch fail');
    const d=await r.json();
    const res=d?.chart?.result?.[0]; if(!res) throw new Error('no result');
    const m=res.meta;
    return {
      symbol:t, name:m.shortName||m.longName||t,
      price:m.regularMarketPrice, prev:m.chartPreviousClose||m.previousClose,
      open:m.regularMarketOpen, high:m.regularMarketDayHigh, low:m.regularMarketDayLow,
      vol:m.regularMarketVolume, mktCap:m.marketCap,
      w52h:m.fiftyTwoWeekHigh, w52l:m.fiftyTwoWeekLow,
      pe:m.trailingPE, pb:m.priceToBook, divYield:m.dividendYield,
      currency:m.currency||'', exchange:m.exchangeName||''
    };
  }catch(e){ return null; }
}

// ── FETCH HISTORY ──
async function fetchHistory(sym, range='1y'){
  const t=ticker(sym);
  const url=`${YF}/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=${range}`;
  try{
    const r=await proxyFetch(url);
    const d=await r.json();
    const res=d?.chart?.result?.[0]; if(!res) return null;
    const ts=res.timestamp||[];
    const q=res.indicators?.quote?.[0]||{};
    return ts.map((t,i)=>({
      date:new Date(t*1000).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'}),
      open:q.open?.[i], high:q.high?.[i], low:q.low?.[i], close:q.close?.[i], vol:q.volume?.[i]
    })).filter(d=>d.close!=null);
  }catch(e){ return null; }
}

// ── FORMAT ──
function fmt(n,d=2){ if(n==null||isNaN(n)) return 'N/A'; if(Math.abs(n)>=1e9) return (n/1e9).toFixed(1)+'B'; if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+'M'; return n.toFixed(d); }
function pct(c,p){ if(!c||!p) return {v:0,s:'0.00%'}; const v=(c-p)/p*100; return {v,s:(v>=0?'+':'')+v.toFixed(2)+'%'}; }
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; }

// ── ANALYSIS ──
function calcSignal(q, hist){
  const prices = hist?hist.map(d=>d.close).filter(Boolean):[];
  const ma5=prices.length>=5?avg(prices.slice(-5)):null;
  const ma20=prices.length>=20?avg(prices.slice(-20)):null;
  const ma60=prices.length>=60?avg(prices.slice(-60)):null;
  const p=q.price;

  // RSI
  let rsi=50;
  if(prices.length>=15){
    const changes=prices.slice(-15).map((v,i,a)=>i===0?0:v-a[i-1]).slice(1);
    const gains=changes.filter(c=>c>0); const losses=changes.filter(c=>c<0).map(Math.abs);
    const ag=gains.length?avg(gains):0; const al=losses.length?avg(losses):0.001;
    rsi=100-(100/(1+ag/al));
  }

  // Signals
  const aboveMa20=ma20&&p>ma20;
  const aboveMa60=ma60&&p>ma60;
  const goldenCross=ma5&&ma20&&ma5>ma20;

  // Score
  let score=5;
  if(aboveMa20) score+=1;
  if(aboveMa60) score+=1;
  if(goldenCross) score+=1;
  if(rsi<30) score+=2;
  else if(rsi>70) score-=2;
  if(q.pe&&q.pe<15) score+=1;
  if(q.pe&&q.pe>40) score-=1;
  if(q.divYield&&q.divYield>0.03) score+=1;
  score=Math.max(1,Math.min(10,Math.round(score)));

  // Buy price suggestions
  const buyPrice=ma20?Math.min(p,ma20*1.01):p*0.97;
  const stopPrice=ma60?ma60*0.97:p*0.93;
  const shortTarget=p*1.08;
  const longTarget=p*1.20;

  const shortVerdict=rsi<40&&aboveMa60?'買入':rsi>70?'不碰':'觀望';
  const longVerdict=aboveMa60&&goldenCross?'買入':aboveMa20?'持有':'觀望';

  return {score,rsi:rsi.toFixed(1),ma5,ma20,ma60,aboveMa20,aboveMa60,goldenCross,buyPrice,stopPrice,shortTarget,longTarget,shortVerdict,longVerdict};
}

async function loadChart(sym, range='1y'){
  if(!sym) return;
  chartSym=sym;
  ['1mo','3mo','1y'].forEach(r=>{ const b=document.getElementById('btn-'+r); if(b) b.className=r===range?'abtn blue':'abtn'; });
  document.getElementById('chart-title').textContent=`📈 ${ticker(sym)} K線圖`;
  const body=document.getElementById('chart-body');
  body.innerHTML=`<div class="ldwrap" style="padding:30px"><div class="spin"></div><div class="ldtxt" style="font-size:13px">載入K線…</div></div>`;
  const hist=await fetchHistory(sym, range);
  if(!hist||!hist.length){ body.innerHTML=`<div class="empwrap"><div class="emptxt">無法載入圖表</div></div>`; return; }

  const labels=hist.map(d=>d.date);
  const closes=hist.map(d=>d.close);
  const opens=hist.map(d=>d.open);

  // MA lines
  const ma5=closes.map((_,i)=>i>=4?avg(closes.slice(i-4,i+1)):null);
  const ma20=closes.map((_,i)=>i>=19?avg(closes.slice(i-19,i+1)):null);
  const ma60=closes.map((_,i)=>i>=59?avg(closes.slice(i-59,i+1)):null);

  body.innerHTML=`<canvas id="myChart" height="260"></canvas>`;
  if(myChart){ myChart.destroy(); myChart=null; }

  const ctx=document.getElementById('myChart').getContext('2d');
  myChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'收盤價',data:closes,borderColor:'#58a6ff',borderWidth:2,pointRadius:0,fill:false,tension:.3},
        {label:'MA5',data:ma5,borderColor:'#f0a500',borderWidth:1.5,pointRadius:0,fill:false,tension:.3},
        {label:'MA20',data:ma20,borderColor:'#3fb950',borderWidth:1.5,pointRadius:0,fill:false,tension:.3},
        {label:'MA60',data:ma60,borderColor:'#f85149',borderWidth:1.5,pointRadius:0,fill:false,tension:.3},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b949e',font:{size:11},boxWidth:20}},tooltip:{mode:'index',intersect:false}},
      scales:{
        x:{ticks:{color:'#484f58',maxRotation:0,maxTicksLimit:8,font:{size:10}},grid:{color:'#21262d'}},
        y:{ticks:{color:'#484f58',font:{size:10}},grid:{color:'#21262d'}}
      }
    }
  });

  // Indicators
  const lastClose=closes[closes.length-1];
  const lastMa20=ma20.filter(Boolean).pop()||0;
  const lastMa60=ma60.filter(Boolean).pop()||0;
  document.getElementById('indicators-out').innerHTML=`
    <div class="card"><div class="cbody" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div class="hm"><div class="hm-l">MA5</div><div class="hm-v">${fmt(ma5.filter(Boolean).pop()||0)}</div></div>
      <div class="hm"><div class="hm-l">MA20</div><div class="hm-v" style="color:${lastClose>lastMa20?'var(--green)':'var(--red)'}">${fmt(lastMa20)}</div></div>
      <div class="hm"><div class="hm-l">MA60</div><div class="hm-v" style="color:${lastClose>lastMa60?'var(--green)':'var(--red)'}">${fmt(lastMa60)}</div></div>
    </div></div>`;
}

function toggleWL(sym,btn){
  const i=wl.indexOf(sym); i===-1?wl.push(sym):wl.splice(i,1);
  localStorage.setItem('wl5',JSON.stringify(wl));
  if(btn){ const inWL=wl.includes(sym); btn.textContent=inWL?'⭐ 已加自選':'☆ 加自選'; btn.className=inWL?'abtn blue':'abtn'; }
  renderWLStatic();
}
function addWL(){ const v=document.getElementById('wl-add').value.trim().toUpperCase(); if(!v) return; if(!wl.includes(ticker(v))){wl.push(ticker(v));localStorage.setItem('wl5',JSON.stringify(wl));} document.getElementById('wl-add').value=''; renderWLStatic(); }
function removeWL(sym){ wl=wl.filter(s=>s!==sym); localStorage.setItem('wl5',JSON.stringify(wl)); renderWLStatic(); }

async function refreshWL(){
  const body=document.getElementById('wl-body');
  if(!wl.length){ renderWLStatic(); return; }
  body.innerHTML=`<div class="ldwrap" style="padding:20px"><div class="spin"></div></div>`;
  const quotes=await Promise.all(wl.map(s=>fetchQuote(s)));
  body.innerHTML=wl.map((sym,i)=>{
    const q=quotes[i]; if(!q) return `<div class="wli"><div class="wli-s">${sym}</div><div style="color:var(--red);font-size:12px;margin-left:auto">無法載入</div><button class="wli-del" onclick="removeWL('${sym}')">✕</button></div>`;
    const chg=pct(q.price,q.prev); const dir=chg.v>0?'up':'dn';
    return `<div class="wli" onclick="analyze('${sym}');nav('analyze',0)">
      <div><div class="wli-s">${q.symbol}</div><div class="wli-n">${q.name?.slice(0,12)}</div></div>
      <div class="wli-r"><div class="wli-p ${dir}">${fmt(q.price)}</div><div class="wli-c ${dir}">${chg.s}</div></div>
      <button class="wli-del" onclick="event.stopPropagation();removeWL('${sym}')">✕</button>
    </div>`;
  }).join('');
}

function renderWLStatic(){
  const body=document.getElementById('wl-body');
  if(!wl.length){ body.innerHTML=`<div class="empwrap" style="min-height:100px"><div class="empicon" style="font-size:28px">⭐</div><div class="emptxt">尚無自選股</div></div>`; return; }
  body.innerHTML=wl.map(sym=>`<div class="wli" onclick="analyze('${sym}');nav('analyze',0)">
    <div><div class="wli-s">${sym}</div><div class="wli-n">點擊查看分析</div></div>
    <div class="wli-r" style="font-size:12px;color:var(--text3)">→</div>
    <button class="wli-del" onclick="event.stopPropagation();removeWL('${sym}')">✕</button>
  </div>`).join('');
}

async function fetchTWSEList(){
  try{
    const url = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';

async function runScreen(){
  const out=document.getElementById('sc-out');
  const mkt=document.getElementById('sc-mkt').value;
  const peMax=parseFloat(document.getElementById('sc-pe-max').value)||30;
  const peMin=parseFloat(document.getElementById('sc-pe-min').value)||0;
  const divMin=parseFloat(document.getElementById('sc-div').value)||0;

  out.innerHTML=`<div class="ldwrap"><div class="spin"></div><div class="ldtxt">篩選中…</div><div class="ldsub" id="sc-sub">載入股票清單…</div></div>`;

  let pool;
  if(mkt==='TW'){
    document.getElementById('sc-sub').textContent='從台灣證交所抓取完整清單…';
    const twseList = await fetchTWSEList();
    pool = twseList;
    document.getElementById('sc-sub').textContent=`共 ${pool.length} 檔，開始篩選（取前50檔分析）…`;
  } else {
    pool = US_STOCKS;
  }

  // 取前50檔避免太慢，隨機打散增加多樣性
  const shuffled = pool.sort(()=>Math.random()-0.5).slice(0,50);
  
  // 批次抓取，每批10檔
  const results = [];
  for(let i=0;i<shuffled.length;i+=10){
    const batch = shuffled.slice(i,i+10);
    document.getElementById('sc-sub') && (document.getElementById('sc-sub').textContent=`分析中 ${Math.min(i+10,shuffled.length)}/${shuffled.length}…`);
    const quotes = await Promise.all(batch.map(s=>fetchQuote(s)));
    results.push(...quotes.filter(Boolean));
  }

  const filtered=results.filter(q=>{
    if(q.pe&&(q.pe<peMin||q.pe>peMax)) return false;
    if(divMin>0&&(!q.divYield||q.divYield*100<divMin)) return false;
    return true;
  }).slice(0,15);

  if(!filtered.length){ out.innerHTML=`<div class="card"><div class="cbody" style="text-align:center;padding:20px;color:var(--text2)">沒有符合條件的股票，請放寬篩選條件</div></div>`; return; }

  out.innerHTML=`<div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin:4px 0 8px">找到 ${filtered.length} 檔符合條件</div>`+
  filtered.map(q=>{
    const chg=pct(q.price,q.prev); const dir=chg.v>0?'up':'dn';
    const typ=q.divYield&&q.divYield>0.03?'div':q.pe&&q.pe<15?'val':'gro';
    const typLbl=typ==='div'?'高殖利率':typ==='val'?'價值型':'成長型';
    return `<div class="sri">
      <div class="sri-top">
        <div><span class="sri-sym">${q.symbol}</span><span style="font-size:12px;color:var(--text2);margin-left:8px">${q.name?.slice(0,12)}</span></div>
        <span class="sri-badge ${typ}">${typLbl}</span>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:8px;font-size:13px;flex-wrap:wrap">
        <span class="${dir}" style="font-weight:800;font-size:16px">${fmt(q.price)}</span>
        <span class="${dir}">${chg.s}</span>
        ${q.pe?`<span style="color:var(--text3)">PE:${fmt(q.pe,1)}</span>`:''}
        ${q.divYield?`<span style="color:var(--amber)">殖利率:${(q.divYield*100).toFixed(1)}%</span>`:''}
        ${q.pb?`<span style="color:var(--text3)">PB:${fmt(q.pb,2)}</span>`:''}
      </div>
      <div style="margin-top:8px"><button onclick="analyze('${q.symbol}');nav('analyze',0)" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer">📊 深度分析</button></div>
    </div>`;
  }).join('');
}

// INIT
renderWLStatic();
</script>
</body>
</html>
