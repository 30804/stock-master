<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 股市大師</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;
  --purple:#bc8cff;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --border:#30363d;--card-r:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:18px;font-weight:900;color:var(--blue);white-space:nowrap;letter-spacing:-0.5px}
.logo em{font-style:normal;color:var(--text2);font-size:12px;font-weight:400;margin-left:3px}
.search-row{flex:1;display:flex;gap:8px;min-width:0}
.sinput{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:11px;color:var(--text);padding:9px 13px;font-size:14px;outline:none;min-width:0;transition:border-color .2s}
.sinput:focus{border-color:var(--blue)}
.sinput::placeholder{color:var(--text3)}
.sbtn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sbtn:active{opacity:.8}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.page.active{display:flex}
.bnav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;border:none;background:none;transition:color .15s}
.nitem.active{color:var(--blue)}
.nitem .ni{font-size:20px;line-height:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);overflow:hidden}
.chead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ctitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.cbody{padding:14px}
.hero{padding:18px 14px}
.h-id{font-size:12px;color:var(--text3);margin-bottom:2px}
.h-name{font-size:20px;font-weight:900;margin-bottom:14px;line-height:1.2}
.h-price{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h-price.up{color:var(--green)}.h-price.dn{color:var(--red)}.h-price.flat{color:var(--text)}
.h-chg{display:inline-block;font-size:16px;font-weight:800;padding:3px 10px;border-radius:8px;margin-top:6px}
.h-chg.up{background:rgba(63,185,80,.15);color:var(--green)}
.h-chg.dn{background:rgba(248,81,73,.15);color:var(--red)}
.h-chg.flat{background:var(--bg3);color:var(--text2)}
.h-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.hm{background:var(--bg3);border-radius:10px;padding:10px 12px}
.hm-l{font-size:10px;color:var(--text3);margin-bottom:3px}
.hm-v{font-size:16px;font-weight:800}
.h-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.abtn{border:1px solid var(--border);background:var(--bg3);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text2)}
.abtn.green{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.3);color:var(--green)}
.abtn.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:var(--red)}
.abtn.blue{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);color:var(--blue)}
.dsig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsc{border-radius:12px;padding:14px;text-align:center}
.dsc.sh{background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.25)}
.dsc.lg{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25)}
.dsc-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.dsc.sh .dsc-t{color:var(--purple)}.dsc.lg .dsc-t{color:var(--blue)}
.dsc-v{font-size:17px;font-weight:900;margin-bottom:10px}
.dsc-v.buy{color:var(--green)}.dsc-v.watch{color:var(--amber)}.dsc-v.avoid{color:var(--red)}
.price-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pr3{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 4px;text-align:center}
.pr3-l{font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase}
.pr3-v{font-size:13px;font-weight:800}
.pr3-v.buy-c{color:var(--green)}.pr3-v.stop-c{color:var(--red)}.pr3-v.tgt-c{color:var(--blue)}
.score-wrap{display:flex;align-items:center;gap:14px}
.score-num{font-size:42px;font-weight:900;line-height:1}
.score-num.s-hi{color:var(--green)}.score-num.s-mi{color:var(--amber)}.score-num.s-lo{color:var(--red)}
.score-right{flex:1}
.score-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:6px 0}
.score-fill{height:100%;border-radius:3px}
.score-fill.s-hi{background:var(--green)}.score-fill.s-mi{background:var(--amber)}.score-fill.s-lo{background:var(--red)}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcbox{border-radius:12px;padding:12px}
.pcbox.pro{background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.2)}
.pcbox.con{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2)}
.pcbox-t{font-size:12px;font-weight:800;margin-bottom:8px}
.pcbox.pro .pcbox-t{color:var(--green)}.pcbox.con .pcbox-t{color:var(--red)}
.pci{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:5px;padding-left:12px;position:relative}
.pci::before{content:'';position:absolute;left:3px;top:7px;width:4px;height:4px;border-radius:50%}
.pcbox.pro .pci::before{background:var(--green)}.pcbox.con .pci::before{background:var(--red)}
.aiblock{background:var(--bg3);border-radius:10px;padding:12px}
.aiblock-t{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.aiblock-c{font-size:13px;color:var(--text2);line-height:1.75}
.aiblock-c strong{color:var(--text)}
.ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldtxt{font-size:15px;color:var(--text2);font-weight:600}
.ldsub{font-size:12px;color:var(--text3);text-align:center;line-height:1.6}
.ldsub span{color:var(--blue)}
.empwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:10px;min-height:160px}
.empicon{font-size:44px;opacity:.25}
.emptxt{font-size:15px;color:var(--text2);font-weight:700}
.empsub{font-size:13px;color:var(--text3);text-align:center;line-height:1.65}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.qbtn{background:none;border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 6px;cursor:pointer;color:var(--text);font-size:13px;font-weight:800;text-align:center;transition:background .12s}
.qbtn:nth-child(4n){border-right:none}
.qbtn:nth-child(n+5){border-bottom:none}
.qbtn:active{background:var(--bg3)}
.qbtn small{display:block;font-size:9px;color:var(--text3);font-weight:400;margin-top:2px}
.wli{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.wli:last-child{border-bottom:none}
.wli:active{background:var(--bg3)}
.wli-s{font-size:16px;font-weight:900;min-width:55px}
.wli-n{font-size:11px;color:var(--text3);margin-top:1px}
.wli-r{margin-left:auto;text-align:right}
.wli-p{font-size:17px;font-weight:800}
.wli-c{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-block;margin-top:2px}
.wli-c.up{background:rgba(63,185,80,.15);color:var(--green)}
.wli-c.dn{background:rgba(248,81,73,.15);color:var(--red)}
.wli-del{padding:8px;color:var(--text3);font-size:16px;background:none;border:none;cursor:pointer}
.up{color:var(--green)}.dn{color:var(--red)}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fsel{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:13px;outline:none;width:100%}
.fsel:focus{border-color:var(--blue)}
.fsel option{background:var(--bg2)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.gbtn{width:100%;background:var(--green);color:#000;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:13px;cursor:pointer}
.gbtn:active{opacity:.8}
.sri{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
.sri-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sri-sym{font-size:17px;font-weight:900}
.sri-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:800}
.sri-badge.val{background:rgba(88,166,255,.15);color:var(--blue)}
.sri-badge.gro{background:rgba(63,185,80,.15);color:var(--green)}
.sri-badge.div{background:rgba(210,153,34,.15);color:var(--amber)}
.sri-pro{font-size:12px;color:var(--text2);margin-bottom:5px;padding-left:13px;position:relative;line-height:1.5}
.sri-pro::before{content:'▲';position:absolute;left:0;color:var(--green);font-size:9px;top:3px}
.sri-risk{font-size:12px;color:var(--text2);padding-left:13px;position:relative;line-height:1.5}
.sri-risk::before{content:'▼';position:absolute;left:0;color:var(--red);font-size:9px;top:3px}
.bearbox{background:rgba(248,81,73,.06);border:1px solid rgba(248,81,73,.2);border-radius:12px;padding:13px;margin-bottom:10px}
.bearbox h4{font-size:12px;font-weight:800;color:var(--red);margin-bottom:7px}
.bearbox p{font-size:13px;color:var(--text2);line-height:1.7}
.infobox{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:12px;padding:13px;margin-bottom:10px}
.infobox h4{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:7px}
.infobox p{font-size:13px;color:var(--text2);line-height:1.7}
.notice{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.25);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--amber);line-height:1.6}
.key-setup{background:var(--bg2);border:1.5px dashed var(--border);border-radius:14px;padding:20px;text-align:center}
.key-setup h3{font-size:16px;font-weight:800;margin-bottom:8px;color:var(--text)}
.key-setup p{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.key-input-row{display:flex;gap:8px;max-width:500px;margin:0 auto}
@media(min-width:600px){.h-meta{grid-template-columns:repeat(4,1fr)}.fgrid2{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📈AI股市<em>大師</em></div>
  <div class="search-row">
    <input class="sinput" id="si" type="text" placeholder="輸入代號：3481、NVDA、群創…"
      onkeydown="if(event.key==='Enter')go()" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="sbtn" onclick="go()">分析</button>
  </div>
</div>

<div class="pages">

  <!-- 分析頁 -->
  <div class="page active" id="p-analyze">
    <div id="a-out">
      <!-- API KEY SETUP -->
      <div class="key-setup" id="key-setup-box">
        <h3>🔑 設定 Gemini API Key</h3>
        <p>輸入你的免費 Gemini API Key 才能開始分析<br>Key 只存在你的瀏覽器裡，不會上傳到任何地方</p>
        <div class="key-input-row">
          <input class="sinput" id="keyInput" type="password" placeholder="貼上 AIza... 開頭的 Key" style="flex:1;background:var(--bg3)">
          <button class="sbtn" onclick="saveKey()">儲存</button>
        </div>
        <p style="margin-top:10px;font-size:11px;color:var(--text3)">免費申請：<a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--blue)">aistudio.google.com/app/apikey</a></p>
      </div>

      <div class="empwrap" id="empty-hint" style="display:none">
        <div class="empicon">🏦</div>
        <div class="emptxt">搜尋股票開始分析</div>
        <div class="empsub">輸入台股代號（如 3481）或美股代號（如 NVDA）<br>AI 搜尋即時股價，給出短線＋長線建議</div>
      </div>

      <div class="card" id="quick-card" style="display:none">
        <div class="chead"><span class="ctitle">⚡ 熱門快速入口</span></div>
        <div class="qgrid">
          <button class="qbtn" onclick="go2('3481')">3481<small>群創</small></button>
          <button class="qbtn" onclick="go2('2330')">2330<small>台積電</small></button>
          <button class="qbtn" onclick="go2('2317')">2317<small>鴻海</small></button>
          <button class="qbtn" onclick="go2('2308')">2308<small>台達電</small></button>
          <button class="qbtn" onclick="go2('NVDA')">NVDA<small>輝達</small></button>
          <button class="qbtn" onclick="go2('AAPL')">AAPL<small>蘋果</small></button>
          <button class="qbtn" onclick="go2('TSLA')">TSLA<small>特斯拉</small></button>
          <button class="qbtn" onclick="go2('META')">META<small>Meta</small></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 自選股頁 -->
  <div class="page" id="p-watch">
    <div class="card">
      <div class="chead">
        <span class="ctitle">⭐ 自選股清單</span>
        <button onclick="refreshWL()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 11px;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer">🔄 更新</button>
      </div>
      <div id="wl-body"></div>
    </div>
    <div class="card">
      <div class="chead"><span class="ctitle">➕ 加入自選</span></div>
      <div class="cbody" style="display:flex;gap:8px">
        <input class="sinput" id="wl-add" type="text" placeholder="輸入代號…" style="flex:1;background:var(--bg3)" onkeydown="if(event.key==='Enter')addWL()">
        <button class="sbtn" style="border-radius:10px;padding:9px 14px" onclick="addWL()">加入</button>
      </div>
    </div>
  </div>

  <!-- 選股頁 -->
  <div class="page" id="p-screen">
    <div class="card">
      <div class="chead"><span class="ctitle">🔍 AI 智慧選股</span></div>
      <div class="cbody">
        <div class="fgrid2">
          <div class="fg"><label>市場</label>
            <select class="fsel" id="sc-mkt">
              <option value="台灣股市上市櫃">🇹🇼 台股</option>
              <option value="美國股市">🇺🇸 美股</option>
              <option value="全球ETF">🌍 ETF</option>
            </select></div>
          <div class="fg"><label>產業</label>
            <select class="fsel" id="sc-sec">
              <option value="不限">不限</option>
              <option value="半導體/科技">半導體/科技</option>
              <option value="AI/機器人">AI/機器人</option>
              <option value="面板/顯示">面板/顯示</option>
              <option value="金融">金融</option>
              <option value="消費/零售">消費/零售</option>
              <option value="醫療生技">醫療生技</option>
            </select></div>
          <div class="fg"><label>投資風格</label>
            <select class="fsel" id="sc-sty">
              <option value="價值型存股">💎 價值/存股</option>
              <option value="成長型高EPS">🚀 高成長</option>
              <option value="高殖利率配息3%以上">💰 高殖利率</option>
              <option value="動能型近期強勢">⚡ 強勢動能</option>
            </select></div>
          <div class="fg"><label>風險</label>
            <select class="fsel" id="sc-rsk">
              <option value="保守大型藍籌">🛡 保守</option>
              <option value="穩健中型成長">⚖️ 穩健</option>
              <option value="積極高波動">🎯 積極</option>
            </select></div>
        </div>
        <div class="fg" style="margin-bottom:12px">
          <label>特殊條件（選填）</label>
          <input id="sc-cus" class="sinput" type="text" style="background:var(--bg3);width:100%" placeholder="例如：AI 受惠、連續配息 5 年…">
        </div>
        <button class="gbtn" onclick="runScreen()">🔍 AI 幫我選股（找 5 檔）</button>
      </div>
    </div>
    <div id="sc-out"></div>
  </div>

  <!-- 空頭頁 -->
  <div class="page" id="p-bear">
    <div class="card" style="background:rgba(248,81,73,.04);border-color:rgba(248,81,73,.2)">
      <div class="chead" style="border-color:rgba(248,81,73,.15)">
        <span class="ctitle" style="color:var(--red)">🐻 空頭攻防 / 最壞情境</span>
      </div>
      <div class="cbody">
        <div style="display:flex;gap:10px;margin-bottom:10px">
          <div class="fg" style="flex:1">
            <label>分析標的</label>
            <input id="bear-s" class="sinput" type="text" style="background:var(--bg3);width:100%" placeholder="股票代號或名稱">
          </div>
          <div class="fg" style="width:90px">
            <label>假設跌幅</label>
            <select id="bear-d" class="fsel">
              <option value="10%">-10%</option>
              <option value="20%" selected>-20%</option>
              <option value="30%">-30%</option>
              <option value="50%">-50%</option>
            </select>
          </div>
        </div>
        <div style="background:rgba(248,81,73,.07);border-radius:10px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.6">
          ⚠️ 強迫 AI 找出真實黑天鵝風險，避免確認偏誤與價值陷阱
        </div>
        <button class="gbtn" style="background:var(--red);color:#fff" onclick="runBear()">🐻 模擬最壞情境</button>
      </div>
    </div>
    <div id="bear-out"></div>
  </div>

</div>

<nav class="bnav">
  <button class="nitem active" id="nb0" onclick="nav('analyze',0)"><span class="ni">📊</span>分析</button>
  <button class="nitem" id="nb1" onclick="nav('watch',1)"><span class="ni">⭐</span>自選</button>
  <button class="nitem" id="nb2" onclick="nav('screen',2)"><span class="ni">🔍</span>選股</button>
  <button class="nitem" id="nb3" onclick="nav('bear',3)"><span class="ni">🐻</span>空頭</button>
</nav>

<script>
const GEMINI_API = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
let wl = JSON.parse(localStorage.getItem('wl4')||'[]');
let lastSym = '';

function getKey(){ return localStorage.getItem('gemini_key')||''; }

function saveKey(){
  const v = document.getElementById('keyInput').value.trim();
  if(!v){ alert('請輸入 API Key'); return; }
  localStorage.setItem('gemini_key', v);
  document.getElementById('key-setup-box').style.display='none';
  document.getElementById('empty-hint').style.display='flex';
  document.getElementById('quick-card').style.display='block';
}

function nav(id,idx){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nitem').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  document.getElementById('nb'+idx).classList.add('active');
}

function go(){ const v=document.getElementById('si').value.trim(); if(!v) return; document.getElementById('si').value=''; analyze(v); }

async function callGemini(prompt){
  const key = getKey();
  if(!key) throw new Error("請先設定 Gemini API Key");
  const isBearer = key.startsWith("AQ.") || key.startsWith("ya29.");
  const url = isBearer ? GEMINI_API : `${GEMINI_API}?key=${key}`;
  const hdrs = {"Content-Type":"application/json"};
  if(isBearer) hdrs["Authorization"]=`Bearer ${key}`;
  const r = await fetch(url,{
    method:"POST", headers: hdrs,
    body: JSON.stringify({
      contents:[{parts:[{text: prompt}]}],
      generationConfig:{temperature:0.7, maxOutputTokens:2000},
      tools:[{googleSearch:{}}]
    })
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.error?.message||"Gemini API 錯誤"); }
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
}

搜尋：「${sym} 股票 今日股價」和「${sym} 近期新聞 財報」

取得數據後，請嚴格按以下格式輸出（繁體中文）：

===股票基本===

今低：

52低：

===基本面===

  try{

    out.innerHTML=`<div class="card"><div class="cbody"><div class="empwrap" style="min-height:120px">
      <div class="empicon" style="font-size:36px">⚠️</div>

        <button onclick="analyze('${sym}')" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer">重試</button>

function renderAnalysis(sym, txt, out){
  const g=(tag)=>{ const m=txt.match(new RegExp(`===${tag}===([\\s\\S]*?)(?====|$)`)); return m?m[1].trim():''; };
  const gv=(b,k)=>{ const m=b.match(new RegExp(`${k}[：:]\\s*(.+)`)); return m?m[1].trim():'N/A'; };

  const basic=g('股票基本'), fund=g('基本面'), tech=g('技術面');
  const pros=g('利多'), cons=g('利空');
  const short=g('短線建議'), long_=g('長線建議'), score=g('評分');

  const name=gv(basic,'名稱'), price=gv(basic,'現價'), chgStr=gv(basic,'漲跌');
  const prev=gv(basic,'昨收'), hi=gv(basic,'今高'), lo=gv(basic,'今低');
  const wk52h=gv(basic,'52高'), dt=gv(basic,'資料時間');

  const chgNum=parseFloat(chgStr.replace(/[^-\d.]/g,''))||0;
  const dir=chgNum>0.3?'up':chgNum<-0.3?'dn':'flat';

  const sv=gv(short,'評等'), sbuy=gv(short,'建議買入價'), sstop=gv(short,'停損價');
  const stgt=gv(short,'短線目標價'), sreason=gv(short,'理由');
  const lv=gv(long_,'評等'), lfair=gv(long_,'長線合理價'), ltgt=gv(long_,'長線目標價'), lreason=gv(long_,'理由');

  const scoreNum=parseInt((score.match(/(\d+)\/10/)||[])[1]||0);
  const scoreReason=gv(score,'原因');
  const sClass=scoreNum>=7?'s-hi':scoreNum>=5?'s-mi':'s-lo';

  const sCls=sv.includes('買入')?'buy':sv.includes('不碰')?'avoid':'watch';
  const lCls=lv.includes('買入')?'buy':lv.includes('減碼')?'avoid':'watch';

  const proList=pros.split('\n').map(l=>l.replace(/^[▲▼\s]+/,'').trim()).filter(l=>l.length>3).slice(0,3);
  const conList=cons.split('\n').map(l=>l.replace(/^[▲▼\s]+/,'').trim()).filter(l=>l.length>3).slice(0,3);

  const inWL=wl.includes(sym.toUpperCase());

  out.innerHTML=`
  <div class="notice">📡 AI 即時搜尋數據（${dt}）· 僅供參考，投資前請自行查證</div>

  <div class="card">
    <div class="hero">
      <div class="h-id">${sym.toUpperCase()}</div>
      <div class="h-name">${name}</div>
      <div class="h-price ${dir}">${price}</div>
      <div class="h-chg ${dir}">${chgStr} 今日</div>
      <div class="h-meta">
        <div class="hm"><div class="hm-l">昨日收盤</div><div class="hm-v">${prev}</div></div>
        <div class="hm"><div class="hm-l">今日最高</div><div class="hm-v" style="color:var(--green)">${hi}</div></div>
        <div class="hm"><div class="hm-l">今日最低</div><div class="hm-v" style="color:var(--red)">${lo}</div></div>
        <div class="hm"><div class="hm-l">52週最高</div><div class="hm-v">${wk52h}</div></div>
      </div>
      <div class="h-actions">
        <button id="wlbtn" class="${inWL?'abtn blue':'abtn'}" onclick="toggleWL('${sym.toUpperCase()}',this)">${inWL?'⭐ 已加自選':'☆ 加自選'}</button>
        <button class="abtn red" onclick="document.getElementById('bear-s').value='${sym}';nav('bear',3)">🐻 空頭分析</button>
        <button class="abtn" onclick="analyze('${sym}')">🔄 重新整理</button>
      </div>
    </div>
  </div>

  <div>
    <div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">📡 AI 買賣建議</div>
    <div class="dsig">
      <div class="dsc sh">
        <div class="dsc-t">⚡ 短線（1-4週）</div>
        <div class="dsc-v ${sCls}">${sv}</div>
        <div class="price-row-3">
          <div class="pr3"><div class="pr3-l">買入價</div><div class="pr3-v buy-c">${sbuy}</div></div>
          <div class="pr3"><div class="pr3-l">停損</div><div class="pr3-v stop-c">${sstop}</div></div>
          <div class="pr3"><div class="pr3-l">目標</div><div class="pr3-v tgt-c">${stgt}</div></div>
        </div>
        ${sreason&&sreason!='N/A'?`<div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5">${sreason}</div>`:''}
      </div>
      <div class="dsc lg">
        <div class="dsc-t">🎯 長線（6-12月）</div>
        <div class="dsc-v ${lCls}">${lv}</div>
        <div class="price-row-3">
          <div class="pr3"><div class="pr3-l">合理價</div><div class="pr3-v tgt-c">${lfair}</div></div>
          <div class="pr3"><div class="pr3-l">目標價</div><div class="pr3-v buy-c">${ltgt}</div></div>
          <div class="pr3"><div class="pr3-l">評等</div><div class="pr3-v ${lCls}">${lv}</div></div>
        </div>
        ${lreason&&lreason!='N/A'?`<div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5">${lreason}</div>`:''}
      </div>
    </div>
  </div>

  ${scoreNum>0?`
  <div class="card"><div class="cbody">
    <div class="score-wrap">
      <div><div class="score-num ${sClass}">${scoreNum}</div><div style="font-size:10px;color:var(--text3);text-align:center">/10</div></div>
      <div class="score-right">
        <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:4px">AI 綜合評分</div>
        <div class="score-bar"><div class="score-fill ${sClass}" style="width:${scoreNum*10}%"></div></div>
        <div style="font-size:12px;color:var(--text3);line-height:1.55">${scoreReason}</div>
      </div>
    </div>
  </div></div>`:''}

  <div>
    <div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">⚖️ 利多 vs 利空</div>
    <div class="pc-grid">
      <div class="pcbox pro"><div class="pcbox-t">📈 利多</div>${proList.map(p=>`<div class="pci">${p}</div>`).join('')||'<div class="pci">分析中</div>'}</div>
      <div class="pcbox con"><div class="pcbox-t">📉 利空</div>${conList.map(c=>`<div class="pci">${c}</div>`).join('')||'<div class="pci">分析中</div>'}</div>
    </div>
  </div>

  ${fund||tech?`<div style="display:flex;flex-direction:column;gap:10px">
    ${fund?`<div class="aiblock"><div class="aiblock-t">📊 基本面</div><div class="aiblock-c">${fund.replace(/\n/g,'<br>')}</div></div>`:''}
    ${tech?`<div class="aiblock"><div class="aiblock-t">📈 技術面</div><div class="aiblock-c">${tech.replace(/\n/g,'<br>')}</div></div>`:''}
  </div>`:''}
  <div style="height:6px"></div>`;
}

function toggleWL(sym,btn){
  const i=wl.indexOf(sym); if(i===-1){wl.push(sym);}else{wl.splice(i,1);}
  localStorage.setItem('wl4',JSON.stringify(wl));
  if(btn){ const inWL=wl.includes(sym); btn.textContent=inWL?'⭐ 已加自選':'☆ 加自選'; btn.className=inWL?'abtn blue':'abtn'; }
  renderWLStatic();
}
function addWL(){ const v=document.getElementById('wl-add').value.trim().toUpperCase(); if(!v) return; if(!wl.includes(v)){wl.push(v);localStorage.setItem('wl4',JSON.stringify(wl));} document.getElementById('wl-add').value=''; renderWLStatic(); }
function removeWL(sym){ wl=wl.filter(s=>s!==sym); localStorage.setItem('wl4',JSON.stringify(wl)); renderWLStatic(); }

async function refreshWL(){
  if(!wl.length) return;
  const body=document.getElementById('wl-body');
  body.innerHTML=`<div class="ldwrap" style="padding:20px"><div class="spin"></div><div class="ldtxt" style="font-size:13px">更新中…</div></div>`;
  try{
    const txt=await callGemini(`請搜尋以下股票的即時股價：${wl.join('、')}\n每檔用「代號|現價|漲跌幅」格式，一行一檔，只輸出數據，不要其他文字。`);
    const map={};
    txt.split('\n').forEach(l=>{ const p=l.split('|'); if(p.length>=3) map[p[0].trim().toUpperCase()]={price:p[1].trim(),chg:p[2].trim()}; });
    body.innerHTML=wl.map(sym=>{
      const info=map[sym]||{price:'—',chg:'—'};
      const d=parseFloat((info.chg||'').replace(/[^-\d.]/g,''))||0;
      const dir=d>0?'up':'dn';
      return `<div class="wli" onclick="analyze('${sym}');nav('analyze',0)">
        <div><div class="wli-s">${sym}</div></div>
        <div class="wli-r"><div class="wli-p ${dir}">${info.price}</div><div class="wli-c ${dir}">${info.chg}</div></div>
        <button class="wli-del" onclick="event.stopPropagation();removeWL('${sym}')">✕</button>
      </div>`;
    }).join('');
  }catch{ renderWLStatic(); }
}

function renderWLStatic(){
  const body=document.getElementById('wl-body');
  if(!wl.length){ body.innerHTML=`<div class="empwrap" style="min-height:100px"><div class="empicon" style="font-size:28px">⭐</div><div class="emptxt">尚無自選股</div></div>`; return; }
  body.innerHTML=wl.map(sym=>`<div class="wli" onclick="analyze('${sym}');nav('analyze',0)">
    <div><div class="wli-s">${sym}</div><div class="wli-n">點擊查看分析</div></div>
    <div class="wli-r" style="font-size:12px;color:var(--text3)">點擊更新 →</div>
    <button class="wli-del" onclick="event.stopPropagation();removeWL('${sym}')">✕</button>
  </div>`).join('');
}

async function runScreen(){

  const prompt=`你是選股策略長。請用 Google 搜尋目前符合以下條件的股票，篩選 5 檔：
市場：${document.getElementById('sc-mkt').value}，產業：${document.getElementById('sc-sec').value}，風格：${document.getElementById('sc-sty').value}，風險：${document.getElementById('sc-rsk').value}${document.getElementById('sc-cus').value?'，特殊：'+document.getElementById('sc-cus').value:''}

每檔用「---」分隔，格式：
代號：
名稱：
亮點：
風險：
類型：（價值型/成長型/配息型 選一個）

全部繁體中文。`;
  try{
    const txt=await callGemini(prompt);
    const items=txt.split(/---+/).map(b=>{
      const sym=(b.match(/代號[：:]\s*(\S+)/)||[])[1]||'';
      const nm=(b.match(/名稱[：:]\s*(.+)/)||[])[1]?.trim()||'';
      const pro=(b.match(/亮點[：:]\s*(.+)/)||[])[1]?.trim()||'';
      const rsk=(b.match(/風險[：:]\s*(.+)/)||[])[1]?.trim()||'';
      const typ=(b.match(/類型[：:]\s*(.+)/)||[])[1]?.trim()||'價值型';
      return sym?{sym,nm,pro,rsk,typ}:null;
    }).filter(Boolean);
    if(!items.length){ out.innerHTML=`<div class="card"><div class="cbody aiblock-c">${txt.replace(/\n/g,'<br>')}</div></div>`; return; }
    out.innerHTML=items.map(it=>{
      const tc=it.typ.includes('成長')?'gro':it.typ.includes('配息')?'div':'val';
      return `<div class="sri">
        <div class="sri-top"><div><span class="sri-sym">${it.sym}</span><span style="font-size:12px;color:var(--text2);margin-left:8px">${it.nm}</span></div><span class="sri-badge ${tc}">${it.typ}</span></div>
        <div class="sri-pro">${it.pro}</div>
        <div class="sri-risk">${it.rsk}</div>
        <div style="margin-top:10px"><button onclick="analyze('${it.sym}');nav('analyze',0)" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer">📊 深度分析</button></div>
      </div>`;
    }).join('');
  }catch(e){ out.innerHTML=`<div class="card"><div class="cbody" style="color:var(--red)">${e.message}</div></div>`; }
}

async function runBear(){

  const out=document.getElementById('bear-out');

  const prompt=`請搜尋 **${sym}** 最新風險因素與新聞，模擬未來 6 個月大跌 **${drop}** 的 Bear Case：

===觸發因素===
⚡ 風險一
⚡ 風險二
⚡ 風險三

===最致命論點===
（最可能成真的 1-2 個，說明為何最危險）

===價值陷阱判斷===
（直接判斷是/不確定/否，並說明）

===下行支撐位===
第一支撐：（數字+原因）
底部估值：（數字+依據）

===止損建議===
停損位：
反轉訊號：

繁體中文，數字具體。`;
  try{
    const txt=await callGemini(prompt);
    const secs=['觸發因素','最致命論點','價值陷阱判斷','下行支撐位','止損建議'];
    let html='';

  }catch(e){ out.innerHTML=`<div class="card"><div class="cbody" style="color:var(--red)">${e.message}</div></div>`; }
}

if(k){ document.getElementById('key-setup-box').style.display='none'; document.getElementById('empty-hint').style.display='flex'; document.getElementById('quick-card').style.display='block'; }
