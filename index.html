<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 股市大師</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--purple:#bc8cff;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;--border:#30363d;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:50}
.logo{font-size:17px;font-weight:900;color:var(--blue);white-space:nowrap}
.logo em{font-style:normal;color:var(--text2);font-size:11px;font-weight:400;margin-left:3px}
.srow{flex:1;display:flex;gap:8px;min-width:0;position:relative}
.sinput{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:11px;color:var(--text);padding:9px 13px;font-size:14px;outline:none;min-width:0}
.sinput:focus{border-color:var(--blue)}
.sinput::placeholder{color:var(--text3)}
.sbtn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.sbtn:active{opacity:.8}

/* AUTOCOMPLETE */
.autocomplete{position:absolute;top:100%;left:0;right:60px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;max-height:200px;overflow-y:auto;z-index:100;margin-top:4px;display:none}
.ac-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.ac-item:hover{background:var(--bg3)}
.ac-code{font-weight:800;color:var(--blue);min-width:45px}
.ac-name{color:var(--text2)}

/* PAGES */
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.page.active{display:flex}

/* BOTTOM NAV */
.bnav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;border:none;background:none}
.nitem.active{color:var(--blue)}
.ni{font-size:20px;line-height:1}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.chead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ctitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.cbody{padding:14px}

/* HERO */
.hero{padding:16px 14px}
.h-name{font-size:19px;font-weight:900;margin-bottom:3px;line-height:1.2}
.h-id{font-size:11px;color:var(--text3);margin-bottom:12px}
.h-price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h-price{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h-price.up{color:var(--green)}.h-price.dn{color:var(--red)}.h-price.flat{color:var(--text)}
.h-chg{font-size:15px;font-weight:800;padding:3px 10px;border-radius:8px}
.h-chg.up{background:rgba(63,185,80,.15);color:var(--green)}
.h-chg.dn{background:rgba(248,81,73,.15);color:var(--red)}
.h-chg.flat{background:var(--bg3);color:var(--text2)}
.h-vol{font-size:12px;color:var(--text3)}

/* META GRID */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.mitem{background:var(--bg3);border-radius:10px;padding:10px 12px}
.ml{font-size:10px;color:var(--text3);margin-bottom:3px}
.mv{font-size:15px;font-weight:800}
.mv.good{color:var(--green)}.mv.bad{color:var(--red)}.mv.warn{color:var(--amber)}

/* SIGNAL CARDS */
.dsig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsc{border-radius:12px;padding:14px;text-align:center}
.dsc.sh{background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.25)}
.dsc.lg{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25)}
.dsc-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.dsc.sh .dsc-t{color:var(--purple)}.dsc.lg .dsc-t{color:var(--blue)}
.dsc-v{font-size:17px;font-weight:900;margin-bottom:8px}
.dsc-v.buy{color:var(--green)}.dsc-v.watch{color:var(--amber)}.dsc-v.avoid{color:var(--red)}
.pr3g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pr3{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 3px;text-align:center}
.pr3-l{font-size:9px;color:var(--text3);margin-bottom:2px}
.pr3-v{font-size:12px;font-weight:800}
.gc{color:var(--green)}.rc{color:var(--red)}.bc{color:var(--blue)}

/* SCORE */
.score-wrap{display:flex;align-items:center;gap:14px}
.score-num{font-size:42px;font-weight:900;line-height:1}
.s-hi{color:var(--green)}.s-mi{color:var(--amber)}.s-lo{color:var(--red)}
.score-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:6px 0}
.score-fill{height:100%;border-radius:3px}
.score-fill.s-hi{background:var(--green)}.score-fill.s-mi{background:var(--amber)}.score-fill.s-lo{background:var(--red)}

/* PROS CONS */
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcbox{border-radius:12px;padding:12px}
.pcbox.pro{background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.2)}
.pcbox.con{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2)}
.pcbox-t{font-size:12px;font-weight:800;margin-bottom:8px}
.pcbox.pro .pcbox-t{color:var(--green)}.pcbox.con .pcbox-t{color:var(--red)}
.pci{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:5px;padding-left:12px;position:relative}
.pci::before{content:'';position:absolute;left:3px;top:7px;width:4px;height:4px;border-radius:50%}
.pcbox.pro .pci::before{background:var(--green)}.pcbox.con .pci::before{background:var(--red)}

/* NEWS */
.news-item{padding:11px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-title{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:4px;cursor:pointer}
.news-title:hover{color:var(--blue)}
.news-meta{font-size:11px;color:var(--text3)}
.news-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;margin-right:6px}
.news-tag.pos{background:rgba(63,185,80,.15);color:var(--green)}
.news-tag.neg{background:rgba(248,81,73,.15);color:var(--red)}
.news-tag.neu{background:rgba(88,166,255,.15);color:var(--blue)}

/* TECH TABLE */
.tech-table{width:100%;border-collapse:collapse;font-size:13px}
.tech-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.tech-table tr:last-child td{border-bottom:none}
.tech-table .tl{color:var(--text3);width:45%}
.tech-table .tv{font-weight:700;text-align:right}
.sig-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700}
.sig-badge.buy{background:rgba(63,185,80,.2);color:var(--green)}
.sig-badge.sell{background:rgba(248,81,73,.2);color:var(--red)}
.sig-badge.hold{background:rgba(210,153,34,.2);color:var(--amber)}

/* VALUATION TABLE */
.val-table{width:100%}
.val-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.val-row:last-child{border-bottom:none}
.val-label{font-size:12px;color:var(--text2)}
.val-num{font-size:14px;font-weight:800}
.val-bar-wrap{flex:1;margin:0 10px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.val-bar-fill{height:100%;border-radius:2px;background:var(--blue)}

/* LOADING */
.ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldtxt{font-size:15px;color:var(--text2);font-weight:600}
.ldsub{font-size:12px;color:var(--text3);text-align:center}

/* EMPTY */
.empwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:10px;min-height:160px}
.empicon{font-size:44px;opacity:.25}
.emptxt{font-size:15px;color:var(--text2);font-weight:700}
.empsub{font-size:13px;color:var(--text3);text-align:center;line-height:1.7}

/* QUICK */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr)}
.qbtn{background:none;border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 6px;cursor:pointer;color:var(--text);font-size:13px;font-weight:800;text-align:center}
.qbtn:nth-child(4n){border-right:none}
.qbtn:nth-child(n+5){border-bottom:none}
.qbtn:active{background:var(--bg3)}
.qbtn small{display:block;font-size:9px;color:var(--text3);font-weight:400;margin-top:2px}

/* WATCHLIST */
.wli{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.wli:last-child{border-bottom:none}
.wli:active{background:var(--bg3)}
.wli-s{font-size:15px;font-weight:900;min-width:55px}
.wli-n{font-size:11px;color:var(--text3);margin-top:1px}
.wli-r{margin-left:auto;text-align:right}
.wli-p{font-size:16px;font-weight:800}
.wli-c{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-block;margin-top:2px}
.wli-c.up{background:rgba(63,185,80,.15);color:var(--green)}
.wli-c.dn{background:rgba(248,81,73,.15);color:var(--red)}
.wli-del{padding:8px;color:var(--text3);font-size:16px;background:none;border:none;cursor:pointer}
.up{color:var(--green)}.dn{color:var(--red)}

/* SCREEN */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fsel{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:13px;outline:none;width:100%}
.fsel option{background:var(--bg2)}
.finput{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:13px;outline:none;width:100%}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.gbtn{width:100%;background:var(--green);color:#000;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:13px;cursor:pointer;margin-bottom:8px}
.gbtn:active{opacity:.8}
.gbtn.red{background:var(--red);color:#fff}

/* SCREEN RESULTS */
.sri{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
.sri-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sri-sym{font-size:17px;font-weight:900}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:800}
.badge.val{background:rgba(88,166,255,.15);color:var(--blue)}
.badge.gro{background:rgba(63,185,80,.15);color:var(--green)}
.badge.div{background:rgba(210,153,34,.15);color:var(--amber)}
.badge.red{background:rgba(248,81,73,.15);color:var(--red)}

/* ACTIONS */
.abtn{border:1px solid var(--border);background:var(--bg3);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text2)}
.abtn.blue{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);color:var(--blue)}
.abtn.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:var(--red)}
.abtn.green{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.25);color:var(--green)}
.h-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* NOTICE */
.notice{border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.6}
.notice.green{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);color:var(--green)}
.notice.amber{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.25);color:var(--amber)}

/* SECTION TITLE */
.stitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}

/* CHART CONTROLS */
.chart-ctrl{display:flex;gap:6px}
.cbtn{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:4px 10px;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer}
.cbtn.active{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue)}

@media(min-width:600px){
  .mgrid{grid-template-columns:repeat(4,1fr)}
  .fgrid2{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📈AI股市<em>大師</em></div>
  <div class="srow">
    <input class="sinput" id="si" type="text" placeholder="代號或名稱：群創、2330、NVDA…"
      oninput="onSearchInput(this.value)" onkeydown="onSearchKey(event)" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="autocomplete" id="ac"></div>
    <button class="sbtn" onclick="go()">分析</button>
  </div>
</div>

<div class="pages">

  <!-- ① 分析頁 -->
  <div class="page active" id="p-analyze">
    <div id="a-out">
      <div class="notice green">✅ 免 API Key！即時抓取 Yahoo Finance 股價數據</div>
      <div class="empwrap">
        <div class="empicon">🏦</div>
        <div class="emptxt">輸入代號或中文名稱開始分析</div>
        <div class="empsub">支援台股（如 3481 或「群創」）<br>美股（如 NVDA）<br>K線圖 · 技術分析 · 估值 · 近期新聞</div>
      </div>
      <div class="card">
        <div class="chead"><span class="ctitle">⚡ 熱門快速入口</span></div>
        <div class="qgrid">
          <button class="qbtn" onclick="go2('3481')">3481<small>群創</small></button>
          <button class="qbtn" onclick="go2('2330')">2330<small>台積電</small></button>
          <button class="qbtn" onclick="go2('2317')">2317<small>鴻海</small></button>
          <button class="qbtn" onclick="go2('2308')">2308<small>台達電</small></button>
          <button class="qbtn" onclick="go2('NVDA')">NVDA<small>輝達</small></button>
          <button class="qbtn" onclick="go2('AAPL')">AAPL<small>蘋果</small></button>
          <button class="qbtn" onclick="go2('TSLA')">TSLA<small>特斯拉</small></button>
          <button class="qbtn" onclick="go2('META')">META<small>Meta</small></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ② 自選股 -->
  <div class="page" id="p-watch">
    <div class="card">
      <div class="chead">
        <span class="ctitle">⭐ 自選股清單</span>
        <button onclick="refreshWL()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 11px;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer">🔄 更新報價</button>
      </div>
      <div id="wl-body"></div>
    </div>
    <div class="card">
      <div class="chead"><span class="ctitle">➕ 加入自選</span></div>
      <div class="cbody" style="display:flex;gap:8px">
        <input class="sinput" id="wl-add" type="text" placeholder="輸入代號或名稱…" style="flex:1;background:var(--bg3)" onkeydown="if(event.key==='Enter')addWL()">
        <button class="sbtn" style="border-radius:10px;padding:9px 14px" onclick="addWL()">加入</button>
      </div>
    </div>
  </div>

  <!-- ③ K線圖 -->
  <div class="page" id="p-chart">
    <div class="card">
      <div class="chead">
        <span class="ctitle" id="chart-title">📈 K 線圖</span>
        <div class="chart-ctrl">
          <button class="cbtn" onclick="loadChart(chartSym,'1mo',this)">1月</button>
          <button class="cbtn" onclick="loadChart(chartSym,'3mo',this)">3月</button>
          <button class="cbtn active" onclick="loadChart(chartSym,'1y',this)">1年</button>
        </div>
      </div>
      <div style="padding:14px" id="chart-body">
        <div class="empwrap"><div class="empicon" style="font-size:32px">📊</div><div class="emptxt">先搜尋一檔股票</div></div>
      </div>
    </div>
    <div id="tech-signals"></div>
  </div>

  <!-- ④ 選股 -->
  <div class="page" id="p-screen">
    <div class="card">
      <div class="chead"><span class="ctitle">🔍 條件選股篩選器</span></div>
      <div class="cbody">
        <div class="fgrid2">
          <div class="fg"><label>市場</label>
            <select class="fsel" id="sc-mkt">
              <option value="TW">🇹🇼 台股（全市場）</option>
              <option value="US">🇺🇸 美股</option>
            </select></div>
          <div class="fg"><label>產業分類</label>
            <select class="fsel" id="sc-ind">
              <option value="">全部</option>
              <option value="半導體">半導體</option>
              <option value="金融">金融</option>
              <option value="電子">電子零組件</option>
              <option value="傳產">傳統產業</option>
              <option value="航運">航運</option>
              <option value="面板">面板</option>
            </select></div>
          <div class="fg"><label>本益比 最低</label>
            <input class="finput" id="sc-pe-min" type="number" value="0" placeholder="0"></div>
          <div class="fg"><label>本益比 最高</label>
            <input class="finput" id="sc-pe-max" type="number" value="25" placeholder="25"></div>
          <div class="fg"><label>最低殖利率 %</label>
            <input class="finput" id="sc-div" type="number" value="0" placeholder="0" step="0.5"></div>
          <div class="fg"><label>最高股淨比 P/B</label>
            <input class="finput" id="sc-pb" type="number" value="5" placeholder="5"></div>
          <div class="fg"><label>今日漲跌</label>
            <select class="fsel" id="sc-chg">
              <option value="">不限</option>
              <option value="up">今日上漲</option>
              <option value="dn">今日下跌</option>
              <option value="bigup">大漲 3%+</option>
              <option value="bigdn">大跌 3%+</option>
            </select></div>
          <div class="fg"><label>技術面</label>
            <select class="fsel" id="sc-tech">
              <option value="">不限</option>
              <option value="above_ma20">站上MA20</option>
              <option value="above_ma60">站上MA60</option>
              <option value="golden">黃金交叉</option>
              <option value="oversold">RSI超賣(&lt;30)</option>
            </select></div>
        </div>
        <button class="gbtn" onclick="runScreen()">🔍 開始篩選（掃描全市場）</button>
        <div id="sc-progress" style="display:none;font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px"></div>
      </div>
    </div>
    <div id="sc-out"></div>
  </div>

</div>

<nav class="bnav">
  <button class="nitem active" id="nb0" onclick="nav('analyze',0)"><span class="ni">📊</span>分析</button>
  <button class="nitem" id="nb1" onclick="nav('watch',1)"><span class="ni">⭐</span>自選</button>
  <button class="nitem" id="nb2" onclick="nav('chart',2)"><span class="ni">📈</span>K線</button>
  <button class="nitem" id="nb3" onclick="nav('screen',3)"><span class="ni">🔍</span>選股</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ══════════════════════════════════════════
// 台股名稱對照表（500+ 檔）
// ══════════════════════════════════════════
const TW_MAP = {

const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://thingproxy.freeboard.io/fetch/'
];
const YF = 'https://query1.finance.yahoo.com';

async function proxyFetch(url){
  for(const p of PROXIES){
    try{
      const r = await fetch(p+encodeURIComponent(url),{headers:{'x-requested-with':'XMLHttpRequest'}});
      if(!r.ok) continue;
      const t = await r.text();
      if(t.length>50) return new Response(t,{status:200,headers:{'Content-Type':'application/json'}});
    }catch(e){ continue; }
  }
  throw new Error('無法連線，請確認網路正常或改用 http://localhost 開啟');
}

function ticker(sym){
  const s = sym.trim();
  if(/[\u4e00-\u9fff]/.test(s)){
    if(TW_MAP[s]) return String(TW_MAP[s])+'.TW';
    for(const[name,code] of Object.entries(TW_MAP)){
      if(name.includes(s)||s.includes(name)) return String(code)+'.TW';
    }
  }
  const u = s.toUpperCase();
  if(/^\d{4,6}$/.test(u)) return u+'.TW';
  if(/^\d{4,6}\.(TW|TWO)$/i.test(u)) return u.toUpperCase();
  return u;
}

async function fetchQuote(sym){
  const t = ticker(sym);
  const url = `${YF}/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=5d`;
  try{
    const r = await proxyFetch(url);
    const d = await r.json();
    const res = d?.chart?.result?.[0]; if(!res) return null;
    const m = res.meta;
    return {
      symbol:t, name:m.shortName||m.longName||t,
      price:m.regularMarketPrice, prev:m.chartPreviousClose||m.previousClose,
      open:m.regularMarketOpen, high:m.regularMarketDayHigh, low:m.regularMarketDayLow,
      vol:m.regularMarketVolume, mktCap:m.marketCap,
      w52h:m.fiftyTwoWeekHigh, w52l:m.fiftyTwoWeekLow,
      pe:m.trailingPE, pb:m.priceToBook, divYield:m.dividendYield,
      eps:m.epsTrailingTwelveMonths, beta:m.beta,
      currency:m.currency||'', exchange:m.exchangeName||''
    };
  }catch(e){ return null; }
}

async function fetchHistory(sym, range='1y'){
  const t = ticker(sym);
  const url = `${YF}/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=${range}`;
  try{
    const r = await proxyFetch(url);
    const d = await r.json();
    const res = d?.chart?.result?.[0]; if(!res) return null;
    const ts = res.timestamp||[];
    const q = res.indicators?.quote?.[0]||{};
    return ts.map((t,i)=>({
      date:new Date(t*1000).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'}),
      ts: t*1000,
      open:q.open?.[i], high:q.high?.[i], low:q.low?.[i], close:q.close?.[i], vol:q.volume?.[i]
    })).filter(d=>d.close!=null);
  }catch(e){ return null; }
}

function fmt(n,d=2){ if(n==null||isNaN(n)||n===undefined) return 'N/A'; if(Math.abs(n)>=1e9) return (n/1e9).toFixed(1)+'B'; if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1)+'M'; return n.toFixed(d); }
function pct(c,p){ if(!c||!p) return {v:0,s:'0.00%'}; const v=(c-p)/p*100; return {v,s:(v>=0?'+':'')+v.toFixed(2)+'%'}; }
function avg(arr){ const a=arr.filter(v=>v!=null&&!isNaN(v)); return a.length?a.reduce((x,y)=>x+y,0)/a.length:null; }
function fmtVol(n){ if(!n||isNaN(n)) return 'N/A'; if(n>=1e8) return (n/1e8).toFixed(1)+'億'; if(n>=1e4) return (n/1e4).toFixed(1)+'萬'; return n.toString(); }

function calcIndicators(prices){
  const n = prices.length;
  const ma5  = n>=5  ? avg(prices.slice(-5))  : null;
  const ma10 = n>=10 ? avg(prices.slice(-10)) : null;
  const ma20 = n>=20 ? avg(prices.slice(-20)) : null;
  const ma60 = n>=60 ? avg(prices.slice(-60)) : null;
  const ma120= n>=120? avg(prices.slice(-120)): null;

  // RSI(14)
  let rsi=50;
  if(n>=15){
    const ch=prices.slice(-15).map((v,i,a)=>i===0?0:v-a[i-1]).slice(1);
    const gains=ch.filter(c=>c>0); const losses=ch.filter(c=>c<0).map(Math.abs);
    const ag=gains.length?avg(gains):0; const al=losses.length?avg(losses):0.001;
    rsi=100-(100/(1+(ag/al)));
  }

  // MACD(12,26,9)
  let macd=null, signal=null, hist_=null;
  if(n>=26){
    const ema=(data,period)=>{
      const k=2/(period+1); let e=avg(data.slice(0,period));
      return data.slice(period).reduce((acc,v)=>{e=v*k+e*(1-k);acc.push(e);return acc;},[e]);
    };
    const ema12=ema(prices,12); const ema26=ema(prices,26);
    const macdLine=ema12.slice(ema12.length-ema26.length).map((v,i)=>v-ema26[i]);
    if(macdLine.length>=9){
      const sig=ema(macdLine,9);
      macd=macdLine[macdLine.length-1];
      signal=sig[sig.length-1];
      hist_=macd-signal;
    }
  }

  // Bollinger Bands (20,2)
  let bbUpper=null, bbLower=null, bbMid=null;
  if(n>=20){
    const sl=prices.slice(-20); const m=avg(sl);
    const std=Math.sqrt(sl.reduce((s,v)=>s+(v-m)**2,0)/20);
    bbMid=m; bbUpper=m+2*std; bbLower=m-2*std;
  }

  const last=prices[prices.length-1];
  const goldenCross = ma5&&ma20&&ma5>ma20;
  const deathCross  = ma5&&ma20&&ma5<ma20;

  return {ma5,ma10,ma20,ma60,ma120,rsi:rsi.toFixed(1),macd,signal:signal,macdHist:hist_,bbUpper,bbLower,bbMid,last,goldenCross,deathCross};
}

function calcSignal(q, ind){
  let score=5;
  const p=q.price;
  const aboveMa20=ind.ma20&&p>ind.ma20;
  const aboveMa60=ind.ma60&&p>ind.ma60;
  if(aboveMa20) score++;
  if(aboveMa60) score++;
  if(ind.goldenCross) score++;
  if(parseFloat(ind.rsi)<30) score+=2;
  else if(parseFloat(ind.rsi)>70) score-=2;
  if(q.pe&&q.pe>0&&q.pe<15) score++;
  if(q.pe&&q.pe>40) score--;
  if(q.divYield&&q.divYield>0.03) score++;
  if(ind.macdHist&&ind.macdHist>0) score++;
  else if(ind.macdHist&&ind.macdHist<0) score--;
  score=Math.max(1,Math.min(10,Math.round(score)));

  const buyPrice  = ind.ma20 ? Math.min(p,ind.ma20*1.005) : p*0.97;
  const stopPrice = ind.ma60 ? ind.ma60*0.97 : p*0.93;
  const shortTgt  = p*1.08;
  const longTgt   = p*1.20;

  const rsiNum = parseFloat(ind.rsi);
  const shortV = rsiNum<40&&aboveMa60?'買入':rsiNum>75?'不碰':aboveMa20?'觀望':'不碰';
  const longV  = aboveMa60&&ind.goldenCross?'買入':aboveMa20?'持有':'觀望';

  return {score,buyPrice,stopPrice,shortTgt,longTgt,shortVerdict:shortV,longVerdict:longV,aboveMa20,aboveMa60};
}

async function loadNews(symbol, name){
  const body = document.getElementById('news-body');
  if(!body) return;
  try{
    // Yahoo Finance RSS
    const url = `https://feeds.finance.yahoo.com/rss/2.0/headline?s=${encodeURIComponent(symbol)}&region=US&lang=en-US`;
    const r = await proxyFetch(url);
    const txt = await r.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(txt,'text/xml');
    const items = Array.from(xml.querySelectorAll('item')).slice(0,6);
    if(!items.length) throw new Error('no news');
    body.innerHTML = items.map(item=>{
      const title = item.querySelector('title')?.textContent||'';
      const link  = item.querySelector('link')?.textContent||'#';
      const pub   = item.querySelector('pubDate')?.textContent||'';
      const date  = pub ? new Date(pub).toLocaleDateString('zh-TW') : '';
      // 簡單情緒判斷
      const pos=['rise','gain','beat','up','profit','growth','surge','high','買','漲','獲利','成長','突破'];
      const neg=['fall','drop','miss','down','loss','decline','cut','low','賣','跌','虧損','下滑','警告'];
      const tl = title.toLowerCase();
      const sentiment = pos.some(w=>tl.includes(w))?'pos':neg.some(w=>tl.includes(w))?'neg':'neu';
      const sentLbl = sentiment==='pos'?'利多':sentiment==='neg'?'利空':'中性';
      return `<div class="news-item">
        <div class="news-title" onclick="window.open('${link}','_blank')">
          <span class="news-tag ${sentiment}">${sentLbl}</span>${title}
        </div>
        <div class="news-meta">${date}</div>
      </div>`;
    }).join('');
  }catch(e){
    body.innerHTML=`<div style="font-size:12px;color:var(--text3);padding:8px 0">
      新聞載入失敗（跨域限制）· 
      <a href="https://finance.yahoo.com/quote/${symbol}/news" target="_blank" style="color:var(--blue)">前往 Yahoo Finance 查看 →</a>
    </div>`;
  }
}

let currentChartRange = '1y';
async function loadChart(sym, range='1y', btn){
  if(!sym){ alert('請先搜尋一檔股票'); return; }
  currentChartRange=range;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('chart-title').textContent=`📈 ${ticker(sym)} K線圖`;
  const body=document.getElementById('chart-body');
  body.innerHTML=`<div class="ldwrap" style="padding:20px"><div class="spin"></div><div class="ldtxt" style="font-size:13px">載入K線…</div></div>`;
  const hist=await fetchHistory(sym,range);
  if(!hist||!hist.length){ body.innerHTML=`<div class="empwrap"><div class="emptxt">無法載入圖表數據</div></div>`; return; }

  const labels=hist.map(d=>d.date);
  const closes=hist.map(d=>d.close);
  const ind=calcIndicators(closes);

  // Moving averages
  const ma5arr  = closes.map((_,i)=>i>=4   ?avg(closes.slice(i-4,i+1))  :null);
  const ma20arr = closes.map((_,i)=>i>=19  ?avg(closes.slice(i-19,i+1)) :null);
  const ma60arr = closes.map((_,i)=>i>=59  ?avg(closes.slice(i-59,i+1)) :null);
  const bbUpper = closes.map((_,i)=>{ if(i<19) return null; const sl=closes.slice(i-19,i+1); const m=avg(sl); const s=Math.sqrt(sl.reduce((a,v)=>a+(v-m)**2,0)/20); return m+2*s; });
  const bbLower = closes.map((_,i)=>{ if(i<19) return null; const sl=closes.slice(i-19,i+1); const m=avg(sl); const s=Math.sqrt(sl.reduce((a,v)=>a+(v-m)**2,0)/20); return m-2*s; });

  // Find key events on chart (golden/death crosses, 52w high/low)
  const annotations=[];
  closes.forEach((c,i)=>{
    if(i<4) return;
    const m5prev=avg(closes.slice(i-5,i)); const m5=avg(closes.slice(i-4,i+1));
    const m20prev=avg(closes.slice(Math.max(0,i-20),i)); const m20=avg(closes.slice(Math.max(0,i-19),i+1));
    if(i>=20 && m5prev<m20prev && m5>m20) annotations.push({idx:i,type:'golden',label:'⚡黃金交叉'});
    if(i>=20 && m5prev>m20prev && m5<m20) annotations.push({idx:i,type:'death',label:'💀死亡交叉'});
  });

  body.innerHTML=`<div style="height:280px;position:relative"><canvas id="myChart"></canvas></div>`;
  if(myChart){ myChart.destroy(); myChart=null; }
  const ctx=document.getElementById('myChart').getContext('2d');

  myChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'收盤',data:closes,borderColor:'#58a6ff',borderWidth:2,pointRadius:0,fill:false,tension:.1,order:1},
        {label:'MA5', data:ma5arr, borderColor:'#f0a500',borderWidth:1.5,pointRadius:0,fill:false,tension:.3,order:2},
        {label:'MA20',data:ma20arr,borderColor:'#3fb950',borderWidth:1.5,pointRadius:0,fill:false,tension:.3,order:3},
        {label:'MA60',data:ma60arr,borderColor:'#f85149',borderWidth:1.5,pointRadius:0,fill:false,tension:.3,order:4},
        {label:'布林上',data:bbUpper,borderColor:'rgba(188,140,255,.5)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false,tension:.3,order:5},
        {label:'布林下',data:bbLower,borderColor:'rgba(188,140,255,.5)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:'+1',backgroundColor:'rgba(188,140,255,.04)',tension:.3,order:5},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:10},boxWidth:16,padding:10}},
        tooltip:{
          callbacks:{
            label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)||''}`
          }
        }
      },
      scales:{
        x:{ticks:{color:'#484f58',maxRotation:0,maxTicksLimit:range==='1mo'?10:range==='3mo'?8:7,font:{size:10}},grid:{color:'#21262d'}},
        y:{ticks:{color:'#484f58',font:{size:10}},grid:{color:'#21262d'}}
      }
    }
  });

  // 技術指標面板
  const rsiNum=parseFloat(ind.rsi);
  document.getElementById('tech-signals').innerHTML=`
  <div class="card"><div class="cbody">
    <div class="stitle">🔬 技術指標</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      <div class="mitem"><div class="ml">RSI(14)</div><div class="mv ${rsiNum<30?'good':rsiNum>70?'bad':''}">${ind.rsi} ${rsiNum<30?'超賣':rsiNum>70?'超買':'正常'}</div></div>
      <div class="mitem"><div class="ml">MACD</div><div class="mv ${ind.macdHist&&ind.macdHist>0?'good':'bad'}">${ind.macdHist?fmt(ind.macdHist,3):'N/A'} ${ind.macdHist?(ind.macdHist>0?'▲':'▼'):''}</div></div>
      <div class="mitem"><div class="ml">均線狀態</div><div class="mv ${ind.goldenCross?'good':ind.deathCross?'bad':''}" style="font-size:12px">${ind.goldenCross?'黃金交叉':ind.deathCross?'死亡交叉':'中性'}</div></div>
      <div class="mitem"><div class="ml">布林通道</div><div class="mv" style="font-size:11px">${ind.bbUpper&&closes[closes.length-1]>ind.bbUpper?'突破上軌 ⚠️':ind.bbLower&&closes[closes.length-1]<ind.bbLower?'跌破下軌 🟢':'通道內'}</div></div>
    </div>
    ${annotations.length?`<div style="font-size:11px;color:var(--text3);margin-bottom:6px">📌 近期事件標記</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
    ${annotations.slice(-5).map(a=>`<span style="font-size:11px;padding:3px 8px;border-radius:6px;background:${a.type==='golden'?'rgba(63,185,80,.15)':'rgba(248,81,73,.15)'};color:${a.type==='golden'?'var(--green)':'var(--red)'}">${labels[a.idx]} ${a.label}</span>`).join('')}
    </div>`:''}
  </div></div>`;
}

function toggleWL(sym,btn){
  const i=wl.indexOf(sym); i===-1?wl.push(sym):wl.splice(i,1);
  localStorage.setItem('wl6',JSON.stringify(wl));
  if(btn){ const inWL=wl.includes(sym); btn.textContent=inWL?'⭐ 已加自選':'☆ 加自選'; btn.className=inWL?'abtn blue':'abtn'; }
  renderWLStatic();
}
function addWL(){
  const v=document.getElementById('wl-add').value.trim();
  if(!v) return;
  const t=ticker(v);
  if(!wl.includes(t)){wl.push(t);localStorage.setItem('wl6',JSON.stringify(wl));}
  document.getElementById('wl-add').value=''; renderWLStatic();
}
function removeWL(sym){ wl=wl.filter(s=>s!==sym); localStorage.setItem('wl6',JSON.stringify(wl)); renderWLStatic(); }

async function refreshWL(){
  const body=document.getElementById('wl-body');
  if(!wl.length){ renderWLStatic(); return; }

    const chg=pct(q.price,q.prev); const dir=chg.v>0?'up':'dn';
    return `<div class="wli" onclick="analyze('${sym}');nav('analyze',0)">

  }).join('');
}

}

let screenRunning=false;

async function runScreen(){
  if(screenRunning) return;
  screenRunning=true;
  const out=document.getElementById('sc-out');
  const prog=document.getElementById('sc-progress');
  const mkt=document.getElementById('sc-mkt').value;
  const peMin=parseFloat(document.getElementById('sc-pe-min').value)||0;
  const peMax=parseFloat(document.getElementById('sc-pe-max').value)||999;
  const divMin=parseFloat(document.getElementById('sc-div').value)||0;
  const pbMax=parseFloat(document.getElementById('sc-pb').value)||999;
  const chgFilter=document.getElementById('sc-chg').value;
  const techFilter=document.getElementById('sc-tech').value;

  prog.style.display='block';
  out.innerHTML='';

  let pool;
  if(mkt==='TW'){
    // 從TWSE抓完整清單
    prog.textContent='從台灣證交所抓取完整股票清單…';
    try{
      const url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
      const r=await proxyFetch(url);
      const data=await r.json();
      pool=data.filter(d=>/^\d{4}$/.test(d.Code)).map(d=>d.Code);
      prog.textContent=`取得 ${pool.length} 檔上市股票，開始篩選…`;
    }catch(e){
      pool=TW_ALL;
      prog.textContent=`使用內建清單 ${pool.length} 檔，開始篩選…`;
    }
  } else {
    pool=US_STOCKS;
  }

  // 隨機抽樣60檔分析（避免太慢）
  const shuffled=[...pool].sort(()=>Math.random()-0.5).slice(0,60);
  const results=[];

  for(let i=0;i<shuffled.length;i+=8){
    const batch=shuffled.slice(i,i+8);
    prog.textContent=`分析中 ${Math.min(i+8,shuffled.length)}/${shuffled.length}…`;
    const quotes=await Promise.all(batch.map(s=>fetchQuote(s)));
    results.push(...quotes.filter(Boolean));
  }

  // 篩選
  const filtered=results.filter(q=>{
    const chg=pct(q.price,q.prev);
    if(q.pe&&q.pe>0&&(q.pe<peMin||q.pe>peMax)) return false;
    if(divMin>0&&(!q.divYield||q.divYield*100<divMin)) return false;
    if(q.pb&&q.pb>pbMax) return false;
    if(chgFilter==='up'&&chg.v<=0) return false;
    if(chgFilter==='dn'&&chg.v>=0) return false;
    if(chgFilter==='bigup'&&chg.v<3) return false;
    if(chgFilter==='bigdn'&&chg.v>-3) return false;
    // 技術面篩選需要歷史數據，先略過（避免太慢）
    return true;
  }).slice(0,15);

  prog.style.display='none';
  screenRunning=false;

  if(!filtered.length){
    out.innerHTML=`<div class="card"><div class="cbody" style="text-align:center;padding:20px;color:var(--text2)">
      沒有符合條件的股票，請放寬篩選條件<br><br>
      <button onclick="document.getElementById('sc-pe-max').value=50;document.getElementById('sc-div').value=0;document.getElementById('sc-pb').value=10;runScreen()" class="abtn">放寬條件重試</button>
    </div></div>`;
    return;
  }

  out.innerHTML=`<div class="stitle" style="margin:4px 0 8px">找到 ${filtered.length} 檔符合條件（點擊深度分析）</div>`+
  filtered.map(q=>{
    const chg=pct(q.price,q.prev); const dir=chg.v>0?'up':'dn';
    const typ=q.divYield&&q.divYield>0.04?'div':q.pe&&q.pe>0&&q.pe<15?'val':'gro';
    const typLbl=typ==='div'?'高殖利率':typ==='val'?'價值型':'成長型';
    return `<div class="sri">
      <div class="sri-top">
        <div><span class="sri-sym">${q.symbol}</span><span style="font-size:12px;color:var(--text2);margin-left:8px">${(q.name||'').slice(0,12)}</span></div>
        <span class="badge ${typ}">${typLbl}</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px;align-items:baseline">
        <span class="${dir}" style="font-weight:800;font-size:17px">${fmt(q.price)}</span>
        <span class="${dir}">${chg.s}</span>
        ${q.pe&&q.pe>0?`<span style="color:var(--text3)">PE:${fmt(q.pe,1)}</span>`:''}
        ${q.pb?`<span style="color:var(--text3)">PB:${fmt(q.pb,2)}</span>`:''}
        ${q.divYield?`<span style="color:var(--amber)">殖:${(q.divYield*100).toFixed(1)}%</span>`:''}
        ${q.eps?`<span style="color:var(--text3)">EPS:${fmt(q.eps,2)}</span>`:''}
      </div>
      <button onclick="analyze('${q.symbol}');nav('analyze',0)" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer">📊 深度分析</button>
    </div>`;
  }).join('');
}

// INIT
renderWLStatic();
document.addEventListener('click',e=>{ if(!e.target.closest('.srow')) hideAC(); });
</script>
</body>
</html>
